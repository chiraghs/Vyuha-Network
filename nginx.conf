worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Load Balancer Upstream Pool (Stateless AppSail Nodes)
    upstream vyuha_backend {
        # Round-robin distribution
        server 127.0.0.1:8000 weight=3 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8001 weight=3 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8002 weight=3 max_fails=2 fail_timeout=10s;
    }

    server {
        listen       8080;
        server_name  localhost;

        # Static Assets CDN Fallback
        location /static/ {
            alias /Volumes/DiskD/HACKATHONS/Vyuha-Network/backend/data/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # AppSail API Pool Proxy Routing
        location / {
            proxy_pass http://vyuha_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable CORS options preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}
